# NOT ACTIVE: rename to ci.yml only after creating matching package scripts.
# Recommended starting PR pipeline for a single-package React TypeScript app.
name: Example CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
# Add database integration/E2E jobs only once test infrastructure and isolated secrets exist.
# Pin GitHub Action SHAs per your org's policy and verify supported Node version.
